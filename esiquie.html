<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESIQUIE - PoliMercado</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/f8/Logo_Instituto_Polit%C3%A9cnico_Nacional.png" alt="Logo IPN" class="ipn-logo">
            <span>PoliMercado</span>
        </div>
        <div class="mascot">
            <span>🐴 Burrito Blanco</span>
        </div>
    </nav>

    <main class="view active">
        <button class="btn btn-outline" onclick="window.location.href='index.html'">← Volver a escuelas</button>
        <h1 class="text-center">📍 ESIQUIE</h1>
        <p class="text-center">¿Qué te gustaría hacer hoy en tu escuela?</p>
        
        <div class="btn-container" style="margin-top: 3rem;">
            <button class="btn btn-large" onclick="document.getElementById('seller-view').style.display='block'; document.getElementById('buyer-view').style.display='none';">
                📦 Soy Vendedor
            </button>
            <button class="btn btn-large btn-outline" onclick="document.getElementById('buyer-view').style.display='block'; document.getElementById('seller-view').style.display='none'; renderBuyerView('ESIQUIE')">
                🛍️ Soy Comprador
            </button>
        </div>

        <!-- Vista Vendedor -->
        <div id="seller-view" style="display:none; margin-top: 3rem;">
            <h2 class="text-center">Publicar un Producto/Servicio en ESIQUIE</h2>
            <div class="form-card">
                <form id="seller-form" onsubmit="handleProductSubmit(event, 'ESIQUIE')">
                    <div class="form-group">
                        <label>Foto del producto</label>
                        <input type="file" accept="image/*" required>
                    </div>
                    <div class="form-group">
                        <label>Nombre del producto o servicio</label>
                        <input type="text" id="prod-name" placeholder="Ej. Tacos de canasta, Asesorías de cálculo..." required>
                    </div>
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="prod-category" required>
                            <option value="">Selecciona una categoría</option>
                            <option value="Comida">Comida</option>
                            <option value="Servicios">Servicios académicos/técnicos</option>
                            <option value="Tecnología">Tecnología y Electrónica</option>
                            <option value="Materiales">Materiales y Libros</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Unidades disponibles</label>
                        <input type="number" id="prod-stock" min="1" placeholder="Cantidad" required>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="prod-global">
                        <label for="prod-global" style="margin:0;">Publicar a nivel global (Visible para todas las escuelas del IPN)</label>
                    </div>
                    <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Publicar Artículo</button>
                </form>
            </div>
        </div>

        <!-- Vista Comprador -->
        <div id="buyer-view" style="display:none; margin-top: 3rem;">
            <h2 class="text-center">Mercado de ESIQUIE</h2>
            <div class="filters">
                <select id="filter-category" onchange="filterProducts('ESIQUIE')" style="padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
                    <option value="All">Todas las categorías</option>
                    <option value="Comida">Comida</option>
                    <option value="Servicios">Servicios</option>
                    <option value="Tecnología">Tecnología</option>
                    <option value="Materiales">Materiales</option>
                </select>
            </div>
            <div class="products-grid" id="products-container"></div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
