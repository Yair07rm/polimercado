<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoliMercado - IPN</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐴</text></svg>">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/f8/Logo_Instituto_Polit%C3%A9cnico_Nacional.png" alt="Logo IPN" class="ipn-logo">
            <span>PoliMercado</span>
        </div>
        <div class="mascot">
            <span>🐴 Burrito Blanco</span>
        </div>
    </nav>

    <main class="view active" id="home-view">
        <h1 class="text-center">¡Bienvenido a PoliMercado!</h1>
        <p class="text-center">El punto de encuentro para comprar y vender en el Instituto Politécnico Nacional.</p>
        <h2 class="text-center" style="margin-top: 2rem; color: var(--guinda);">Nivel Superior</h2>
        
        <div class="school-grid" id="schools-container">
            <!-- Escuelas generadas por app.js -->
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderSchoolsGrid();
        });
    </script>
</body>
</html>
